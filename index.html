<style>
:root{--bg:#f4fafc;--card:#fff;--tx:#1f2937;--mu:#5f6b7a;--bd:#d3e3ea;--bl:#0041d3;--gr:#0dba39;--li:#b4e01c;--cy:#2cd5f2;--ok:#0a7d27;--bad:#b42318;--tint:#e6f6fb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--card:#16212e;--tx:#e8eef4;--mu:#9aa8b6;--bd:#2a3a4b;--bl:#7aa5ff;--ok:#4ade80;--bad:#f87171;--tint:#14303a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1620;--card:#16212e;--tx:#e8eef4;--mu:#9aa8b6;--bd:#2a3a4b;--bl:#7aa5ff;--ok:#4ade80;--bad:#f87171;--tint:#14303a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:780px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:12px;padding:10px 0 12px;border-bottom:4px solid;border-image:linear-gradient(90deg,var(--gr),var(--li),var(--cy),var(--bl)) 1;margin-bottom:14px}
header img{width:54px;height:54px;border-radius:8px}
header h1{font-size:19px;margin:0;color:var(--bl)}header p{margin:0;color:var(--mu);font-size:12px}header .sp{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px;color:var(--bl)}
label{display:block;font-weight:600;font-size:13px;margin:8px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.btn{background:var(--bl);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;margin-top:10px;cursor:pointer}
.btn.s{background:var(--tint);color:var(--bl);padding:6px 10px;margin:2px 0;font-size:12px}.btn.d{background:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font-weight:600}
.tabs .on{background:var(--bl);color:#fff;border-color:var(--bl)}
.msg{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0}.ok{color:var(--ok)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--tint)}
.g{font-size:34px;font-weight:700;color:var(--bl);line-height:1}
.bar{height:9px;border-radius:9px;background:var(--tint);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),var(--cy))}
.ar{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.codes{background:var(--tint);border-radius:8px;padding:10px;margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
small,.n{color:var(--mu);font-size:12px}

<main id="app"></main>
<p class="n" style="text-align:center">Sistema Integral de Pre-ICFES · Vamos por el 500.</p>

<script>
/* ===== CONFIGURACIÓN: pega aquí los datos de tu proyecto de Supabase ===== */
const SUPA_URL="PEGA_AQUI_LA_URL_DEL_PROYECTO";      // https://xxxx.supabase.co
const SUPA_KEY="PEGA_AQUI_LA_LLAVE_ANON";            // llave pública (anon o publishable). NUNCA la service_role
/* ========================================================================= */
const AR=[["MA","Matemáticas"],["LC","Lectura Crítica"],["SC","Sociales"],["CN","C. Naturales"],["IN","Inglés"]];
const MOT={no_registrado:"Este documento no está registrado. Pide al administrador que lo agregue.",autorizacion_pendiente:"Tu autorización aún no ha sido recibida. Entrégala diligenciada y firmada para activar tu acceso al SISREI.",excluido:"Tu acceso fue excluido del SISREI. Habla con el administrador.",codigo_invalido:"Código no válido.",deshabilitado:"Este código fue deshabilitado."};
const ERR={sesion_invalida:"Tu sesión expiró o ya no es válida. Ingresa de nuevo.",demasiados_intentos:"Demasiados intentos. Espera unos minutos e inténtalo otra vez.",estudiante_inexistente:"Ese estudiante no existe."};
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s),app=$("#app");
let sess=null,tab="est",msg="",ok="",codes=null,U=[],busy=false;
try{sess=JSON.parse(sessionStorage.getItem("sisrei-s"))}catch(e){}
const setS=s=>{sess=s;try{s?sessionStorage.setItem("sisrei-s",JSON.stringify(s)):sessionStorage.removeItem("sisrei-s")}catch(e){}};
async function rpc(fn,a){
 const h={"Content-Type":"application/json",apikey:SUPA_KEY};
 if(SUPA_KEY.startsWith("eyJ"))h.Authorization="Bearer "+SUPA_KEY;
 const r=await fetch(SUPA_URL.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(a||{})});
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&j.message)||("HTTP "+r.status));
 return j;
}
const call=(fn,a)=>rpc(fn,Object.assign({p_token:sess&&sess.token},a));
const txt=e=>ERR[e.message]||("No se pudo completar la acción ("+e.message+").");
async function render(){
 $("#out").innerHTML=sess?'<button class="btn s" data-act="exit">Salir</button>':"";
 if(/PEGA_AQUI/.test(SUPA_URL+SUPA_KEY))return setup();
 if(!sess)return login();
 try{
  if(sess.rol=="estudiante")await stu();else if(sess.rol=="administrador")await adm();else await tut();
 }catch(e){
  if(e.message=="sesion_invalida"){setS(null);msg=ERR.sesion_invalida;return render()}
  app.innerHTML='<div class="card"><p class="msg">'+esc(txt(e))+'</p></div>';
 }
}
function setup(){app.innerHTML='<div class="card"><h2>Falta conectar la base de datos</h2><p>Abre este archivo y reemplaza <b>SUPA_URL</b> y <b>SUPA_KEY</b> (al inicio del script) con la URL y la llave pública de tu proyecto de Supabase.</p></div>'}
function login(){const e=tab=="est";
 app.innerHTML=`<div class="card"><div class="tabs"><button class="${e?"on":""}" data-act="tab" data-v="est">Estudiante</button><button class="${e?"":"on"}" data-act="tab" data-v="staff">Tutor o administrador</button></div>
 <label for="in">${e?"Número de documento":"Código personal"}</label>
 <input id="in" autocomplete="off" inputmode="${e?"numeric":"text"}" placeholder="${e?"Ej.: 1000":"Código personal"}">
 <button class="btn" data-act="login">Ingresar</button><p class="msg">${esc(msg)}</p></div>`;
 $("#in").addEventListener("keydown",k=>{if(k.key=="Enter")act("login")});
}
async function stu(){
 const d=await call("est_mis_resultados"),st=d.estudiante,G=[];
 d.resultados.forEach(r=>{let g=G.find(x=>x.s==r.simulacro);if(!g)G.push(g={s:r.simulacro,v:{}});g.v[r.area]=r.puntaje});
 const l=G[G.length-1],pf=v=>v==null?"–":Math.round(v);
 app.innerHTML=`<div class="card"><h2>Hola, ${esc(st.nombre)}</h2><small>Documento ${esc(st.documento)} · Grado ${esc(st.grado)}${st.curso?" · "+esc(st.curso):""}</small></div>`+
 (l?`<div class="card"><small>Último resultado · ${esc(l.s)}</small><div class="g">${pf(l.v.GLOBAL)}<span style="font-size:14px;font-weight:400"> / 500 estimado</span></div>
 ${AR.map(([k,n])=>`<div class="ar"><span>${n}</span><div class="bar"><i style="width:${Math.min(100,l.v[k]||0)}%"></i></div><b>${pf(l.v[k])}</b></div>`).join("")}</div>
 <div class="card"><h2>Historial</h2><div class="sc"><table><tr><th>Simulacro</th>${AR.map(a=>"<th>"+a[1].slice(0,4)+".</th>").join("")}<th>Global</th></tr>${G.map(g=>`<tr><td>${esc(g.s)}</td>${AR.map(a=>"<td>"+pf(g.v[a[0]])+"</td>").join("")}<td><b>${pf(g.v.GLOBAL)}</b></td></tr>`).join("")}</table></div></div>`
 :'<div class="card">Aún no tienes resultados.</div>')+
 (d.evaluaciones.length?`<div class="card"><h2>Evaluación individual</h2>${d.evaluaciones.map(v=>`<p><b>${esc(v.area||"General")}</b> · <small>${esc(v.fecha)}</small><br>Fortalezas: ${esc(v.fortalezas)}<br>Por mejorar: ${esc(v.debilidades)}<br>Recomendación: ${esc(v.recomendacion)}</p>`).join("")}</div>`:"")+
 '<p class="n">Los puntajes son estimados, no oficiales.</p>';
}
async function tut(){
 const L=await call("tut_listar_estudiantes");
 app.innerHTML=`<div class="card"><h2>${esc(sess.nombre||"Panel")}</h2><small>Solo ves estudiantes con autorización recibida.</small></div>
 <div class="card"><h2>Estudiantes activos</h2><div class="sc"><table><tr><th>Documento</th><th>Nombre</th><th>Grado</th><th>Último global</th></tr>${L.map(s=>`<tr><td>${esc(s.documento)}</td><td>${esc(s.nombre)}</td><td>${esc(s.grado)}</td><td>${s.ultimo_global==null?"–":Math.round(s.ultimo_global)}</td></tr>`).join("")||"<tr><td colspan=4>Sin estudiantes activos</td></tr>"}</table></div></div>`;
}
async function adm(){
 const [E,us]=await Promise.all([call("adm_listar_estudiantes"),call("adm_listar_usuarios")]);U=us;
 const pc=e=>e=="activo"?"ok":"bad",lbl={activo:"Activo",pendiente:"Pendiente",excluido:"Excluido"};
 const mx=Math.max(2026,...U.map(u=>u.ciclo||0));
 app.innerHTML=`<div class="card"><h2>Panel del administrador</h2><small>${E.length} estudiantes · ${E.filter(s=>s.estado=="activo").length} activos · ${U.filter(u=>u.rol=="tutor"&&u.activo).length} códigos de tutor activos</small></div>
 <div class="card"><h2>Estudiantes</h2><div class="sc"><table><tr><th>Documento</th><th>Nombre</th><th>Grado</th><th>Estado</th><th></th></tr>${E.map(s=>`<tr><td>${esc(s.documento)}</td><td>${esc(s.nombre)}</td><td>${esc(s.grado)}</td><td><span class="pill" style="color:var(--${pc(s.estado)})">${lbl[s.estado]||esc(s.estado)}</span></td><td>${s.estado=="activo"?`<button class="btn s" data-act="rev" data-v="${esc(s.documento)}">Revocar</button>`:`<button class="btn s" data-act="recv" data-v="${esc(s.documento)}">Autorización recibida</button>`} <button class="btn s" data-act="del" data-v="${esc(s.documento)}">Borrar</button></td></tr>`).join("")}</table></div>
 <label>Agregar estudiante</label><div class="row"><input id="nd" inputmode="numeric" placeholder="Documento"><input id="nn" placeholder="Nombres"><input id="na" placeholder="Apellidos"><input id="ng" inputmode="numeric" placeholder="Grado"><input id="nk" placeholder="Curso"></div>
 <button class="btn" data-act="add">Agregar (queda pendiente)</button></div>
 <div class="card"><h2>Personal</h2><div class="sc"><table><tr><th>Nombre</th><th>Rol</th><th>Ciclo</th><th>Estado</th><th></th></tr>${U.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.rol)}</td><td>${esc(u.ciclo||"–")}</td><td><span class="pill" style="color:var(--${u.activo?"ok":"bad"})">${u.activo?"Activo":"Deshabilitado"}</span></td><td>${u.rol=="administrador"?"":`<button class="btn s" data-act="tg" data-v="${esc(u.id)}">${u.activo?"Deshabilitar":"Habilitar"}</button>`}</td></tr>`).join("")}</table></div>
 <button class="btn d" data-act="fin">Finalizar actividades (deshabilitar tutores)</button>
 <label>Nuevo ciclo</label><div class="row"><input id="nc" type="number" min="1" max="50" value="3" aria-label="Cantidad"><input id="ny" type="number" value="${mx+1}" aria-label="Año del ciclo"></div>
 <button class="btn" data-act="cyc">Generar códigos nuevos (cantidad y año)</button>
 ${codes?`<div class="codes"><b>Códigos (se muestran una sola vez; entrégalos de forma personal):</b><br>${codes.map(c=>esc(c.nombre)+": <b>"+esc(c.codigo)+"</b>").join("<br>")}</div>`:""}</div>
 <p class="msg">${esc(msg)}</p><p class="msg ok">${esc(ok)}</p>`;
}
async function act(a,v){
 if(busy)return;busy=true;msg="";ok="";
 try{
  if(a=="tab")tab=v;
  else if(a=="exit"){try{await call("cerrar_sesion")}catch(e){}setS(null);codes=null}
  else if(a=="login"){
   const x=$("#in").value.trim();if(!x){msg="Escribe tu "+(tab=="est"?"número de documento.":"código.")}
   else if(tab=="est"){const r=await rpc("ingresar_estudiante",{p_documento:x});if(r.ok)setS({rol:"estudiante",token:r.token});else msg=MOT[r.motivo]||"No se pudo ingresar."}
   else{const r=await rpc("ingresar_personal",{p_codigo:x});if(r.ok)setS({rol:r.rol,token:r.token,nombre:r.nombre});else msg=MOT[r.motivo]||"No se pudo ingresar."}
  }
  else if(a=="add"){const d=$("#nd").value.trim(),n=$("#nn").value.trim(),g=parseInt($("#ng").value,10);
   if(!/^\d{4,12}$/.test(d)||!n||!(g>=8&&g<=11))msg="Escribe documento (4 a 12 números), nombres y un grado entre 8 y 11.";
   else{await call("adm_agregar_estudiante",{p_documento:d,p_nombres:n,p_apellidos:$("#na").value.trim(),p_grado:g,p_curso:$("#nk").value.trim()||null});ok="Estudiante agregado como pendiente."}}
  else if(a=="recv"){const n=(prompt("Nombre del acudiente que firmó la autorización:")||"").trim();if(n){await call("adm_registrar_autorizacion",{p_documento:v,p_acudiente_nombre:n});ok="Autorización registrada. El estudiante ya puede ingresar."}}
  else if(a=="rev"){if(confirm("¿Revocar la autorización? El estudiante perderá el acceso.")){await call("adm_revocar_autorizacion",{p_documento:v,p_borrar:false});ok="Autorización revocada."}}
  else if(a=="del"){if(confirm("¿Borrar al estudiante y sus datos personales? Esto no se puede deshacer.")){await call("adm_revocar_autorizacion",{p_documento:v,p_borrar:true});ok="Estudiante borrado."}}
  else if(a=="tg"){const u=U.find(q=>q.id==v);await call("adm_usuario_activar",{p_usuario:v,p_activo:!u.activo})}
  else if(a=="fin"){if(confirm("¿Deshabilitar todos los códigos de tutor?")){const n=await call("adm_finalizar_ciclo");ok="Se deshabilitaron "+n+" códigos de tutor."}}
  else if(a=="cyc"){const n=parseInt($("#nc").value,10),y=parseInt($("#ny").value,10);
   if(!(n>=1&&n<=50)||!(y>2000))msg="Cantidad entre 1 y 50 y un año válido.";else{codes=await call("adm_generar_codigos",{p_cantidad:n,p_ciclo:y})}}
  if(a!="cyc")codes=null;
 }catch(e){if(e.message=="sesion_invalida"){setS(null);msg=ERR.sesion_invalida}else msg=txt(e)}
 busy=false;render();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)act(b.dataset.act,b.dataset.v)});
render();
</script></body></html>
