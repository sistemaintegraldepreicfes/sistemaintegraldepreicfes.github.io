<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SISREI · Beta 1.1 · Sistema Integral de Pre-ICFES</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4fafc;--card:#fff;--tx:#14202b;--mu:#566472;--bd:#d3e3ea;--bl:#0041d3;--gr:#0dba39;--li:#b4e01c;--cy:#2cd5f2;--ok:#0a7d27;--bad:#b42318;--tint:#e6f6fb;--hb:#eaf3f5;--hc:#a9cfd6;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--card:#16212e;--tx:#e8eef4;--mu:#9aa8b6;--bd:#2a3a4b;--bl:#7aa5ff;--ok:#4ade80;--bad:#f87171;--tint:#14303a;--hb:#14222e;--hc:#2a4452;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1620;--card:#16212e;--tx:#e8eef4;--mu:#9aa8b6;--bd:#2a3a4b;--bl:#7aa5ff;--ok:#4ade80;--bad:#f87171;--tint:#14303a;--hb:#14222e;--hc:#2a4452;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:780px;margin:0 auto;padding:14px}
.top{background:var(--gr);padding-top:env(safe-area-inset-top,0px)}
.tp{max-width:780px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:14px}
.lg{background:#fff;padding:8px;flex:none}.lg img{display:block;width:66px;height:66px}
.kk{color:#fff;font-weight:800;letter-spacing:.2em;font-size:11px;text-transform:uppercase;line-height:1.6;flex:1}
.hero{background-color:var(--hb);background-image:radial-gradient(circle,transparent 4px,var(--hc) 5px,var(--hc) 6px,transparent 7px);background-size:24px 24px;padding:26px 0 28px;border-bottom:6px solid var(--li)}
.hero h1{margin:0;color:#fff;font-weight:900;font-size:clamp(34px,11vw,60px);line-height:1;-webkit-text-stroke:3px #000;paint-order:stroke fill;word-break:break-word}
.hero p{display:inline-block;margin:10px 0 0;background:var(--card);padding:4px 10px;border-radius:6px;font-weight:700;letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin:0 0 10px;color:var(--bl)}
label{display:block;font-weight:700;font-size:12px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
input[type=checkbox]{width:auto}
.btn{background:var(--bl);color:#fff;border:0;border-radius:999px;padding:11px 20px;font:inherit;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-top:10px;cursor:pointer}
.btn.s{background:var(--tint);color:var(--bl);padding:6px 12px;margin:2px 0;font-size:11px}.btn.d{background:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;font:inherit;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.tabs .on{background:var(--bl);color:#fff;border-color:var(--bl)}
.msg{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0;font-weight:600}.ok{color:var(--ok)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;background:var(--tint)}
.sp2{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-bottom:12px}@media(max-width:560px){.sp2{grid-template-columns:1fr}}
.gp{background:var(--gr);color:#fff;border-radius:14px;padding:16px}.gp h2{color:#fff}
.gp .ar{letter-spacing:.08em;text-transform:uppercase;font-size:12px}.gp .bar{background:rgba(255,255,255,.3)}.gp .bar i{background:#fff}
.sb{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:0}
.g{font-size:64px;font-weight:900;color:var(--bl);line-height:1}
.bar{height:9px;border-radius:9px;background:var(--tint);overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.ar{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.pv-t{margin-top:8px}textarea{resize:vertical}.tx{white-space:pre-wrap}
.cell{background:var(--tint);color:var(--bl);border:0;border-radius:8px;padding:5px 9px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.cell sup{color:var(--bad);font-weight:800}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.mc{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:580px;max-height:88vh;overflow:auto;border-top:6px solid var(--gr)}
.nt{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}
.codes{background:var(--tint);border-radius:10px;padding:10px;margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
small,.n{color:var(--mu);font-size:12px}
h2{display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:16px;border-radius:3px;background:linear-gradient(var(--gr),var(--cy));flex:none}
.gp h2::before{background:#fff}
.card{scroll-margin-top:64px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--cy)}
.tile b{font-size:30px;line-height:1;color:var(--bl);font-weight:900}
.tile.txt b{font-size:17px;line-height:1.2}
.tile small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.tile.g{background:var(--gr);border-color:var(--gr);border-top-color:var(--li);color:#fff}.tile.g b,.tile.g small{color:#fff}
.chips{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--bd);color:var(--bl);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;text-decoration:none}
.lg2{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:stretch;margin-bottom:12px}
.wp{display:flex;flex-direction:column;justify-content:center}
.wp .ic{width:84px;height:84px;margin-bottom:10px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.wp h2{font-size:17px}
.feat{display:flex;gap:10px;align-items:center;margin:9px 0;font-size:14px;font-weight:600}
.feat span{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px;flex:none}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{border:1px dashed var(--bd);border-radius:12px;padding:12px;font-size:13px}
.step i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--bl);color:#fff;font-style:normal;font-weight:800;margin-bottom:6px}
.empty{text-align:center;padding:26px 16px}.empty p{max-width:430px;margin:8px auto}
.empty .eico{width:76px;height:76px;margin:0 auto 6px}
@media(max-width:700px){.lg2,.steps{grid-template-columns:1fr}}
</style></head><body>

 const h={"Content-Type":"application/json",apikey:SUPA_KEY};
 if(SUPA_KEY.startsWith("eyJ"))h.Authorization="Bearer "+SUPA_KEY;

 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}

}

  const n=Number(raw.replace("%","").replace(",","."));
  if(isNaN(n)||n<0||n>max)bad.push("fila "+(i+2)+": nota “"+raw+"” fuera de 0 a "+max);else m.set(doc,n)});

}

 R.slice(1).forEach((c,i)=>{const o={documento:""};
  H.forEach((k,j)=>{if(!k)return;const v=(c[j]||"").trim();

const histHtml=()=>`<h3 style="margin:12px 0 4px">Promedios por promoción (solo internos)</h3><div class="sc"><table><tr><th>Año</th><th>Grado</th><th>Estud.</th><th>Prom. global</th>${AR.map(a=>"<th>"+a[0]+"</th>").join("")}</tr>${HIST.agg.map(g=>`<tr><td>${esc(g.anio)}</td><td>${esc(g.grado)}.º</td><td>${esc(g.n)}</td><td><b>${esc(g.promedio_global)}</b></td>${AR.map(a=>"<td>"+(g.promedios_area&&g.promedios_area[a[0]]!=null?esc(g.promedios_area[a[0]]):"–")+"</td>").join("")}</tr>`).join("")||"<tr><td colspan=9>Sin cierres todavía</td></tr>"}</table></div>
<h3 style="margin:12px 0 4px">Estudiantes</h3><div class="sc"><table><tr><th>Año</th><th>Estudiante</th><th>Documento</th><th>Grado</th><th>Tipo</th><th>Promedio</th><th>Simulacros</th><th>Eval. adic.</th></tr>${HIST.rows.map(r=>`<tr><td>${esc(r.anio)}</td><td>${r.nombre?esc(r.nombre):"<small>(anónimo)</small>"}</td><td>${esc(r.documento||"–")}</td><td>${esc(r.grado)}.º</td><td>${r.tipo=="externo"?"Externo":"Interno"}</td><td><b>${r.promedio==null?"–":esc(r.promedio)}</b></td><td>${esc(r.n_simulacros)}</td><td>${r.promedio_adicional==null?"–":esc(r.promedio_adicional)}</td></tr>`).join("")||"<tr><td colspan=8>Sin registros</td></tr>"}</table></div>`;
function fillPE(){const g=$("#pg"),pe=$("#pe");if(!g||!pe)return;const gr=parseInt(g.value,10);
 pe.innerHTML=EST.filter(s=>s.estado=="activo"&&s.tipo!="externo"&&s.grado==gr).map(s=>`<option value="${esc(s.documento)}">${esc(s.nombre)}</option>`).join("")||"<option value=''>Sin estudiantes activos</option>"}
function dlCsv(name,cols,rows){const csv="\uFEFF"+[cols.join(",")].concat(rows.map(r=>cols.map(c=>cel(r[c])).join(","))).join("\r\n")+"\r\n",l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));l.download=name;l.click()}
async function act(a,v,ds){
 if(busy)return;busy=true;msg="";ok="";let skip=false;
 try{
  if(a=="tab")tab=v;
  else if(a=="exit"){try{await call("cerrar_sesion")}catch(e){}setS(null);codes=null;V=null;closeModal()}
  else if(a=="login"){
   const x=$("#in").value.trim();if(!x){msg="Escribe tu "+(tab=="est"?"número de documento.":"código.")}
   else if(tab=="est"){const r=await rpc("ingresar_estudiante",{p_documento:x});if(r.ok)setS({rol:"estudiante",token:r.token});else msg=MOT[r.motivo]||"No se pudo ingresar."}
   else{const r=await rpc("ingresar_personal",{p_codigo:x});if(r.ok)setS({rol:r.rol,token:r.token,nombre:r.nombre});else msg=MOT[r.motivo]||"No se pudo ingresar."}
  }
  else if(a=="add"){const d=$("#nd").value.trim(),n=$("#nn").value.trim(),g=parseInt($("#ng").value,10);
   if(!/^\d{4,12}$/.test(d)||!n||!(g>=8&&g<=11))msg="Escribe documento (4 a 12 números), nombres y un grado entre 8 y 11.";
   else{await call("adm_agregar_estudiante",{p_documento:d,p_nombres:n,p_apellidos:$("#na").value.trim(),p_grado:g,p_curso:$("#nk").value.trim()||null,p_tipo:$("#nt2").value,p_institucion:$("#ni").value.trim()||null});ok="Estudiante agregado como pendiente."}}
  else if(a=="recv"){const n=(prompt("Nombre del acudiente que firmó la autorización:")||"").trim();if(n){await call("adm_registrar_autorizacion",{p_documento:v,p_acudiente_nombre:n});ok="Autorización registrada. El estudiante ya puede ingresar."}}
  else if(a=="rev"){if(confirm("¿Revocar la autorización? El estudiante perderá el acceso.")){await call("adm_revocar_autorizacion",{p_documento:v,p_borrar:false});ok="Autorización revocada."}}
  else if(a=="del"){if(confirm("¿Borrar al estudiante y sus datos personales? Esto no se puede deshacer.")){await call("adm_revocar_autorizacion",{p_documento:v,p_borrar:true});ok="Estudiante borrado."}}
  else if(a=="sim"){const n=$("#sn").value.trim(),t=$("#st").value;
   if(!n)msg="Escribe un nombre para el simulacro.";
   else{selSim=await call("adm_crear_simulacro",{p_nombre:n,p_tipo:t,p_fecha:$("#sf").value||null,p_obligatorio:t!="virtual",p_cuenta_premio:$("#sp").checked});ok="Simulacro creado."}}
  else if(a=="load"){const id=parseInt($("#ss").value,10);
   if(!id)msg="Elige un simulacro.";else if(!pend||!pend.rows||pend.bad.length)msg="Sube un archivo válido.";
   else{const r=await call("adm_cargar_resultados",{p_simulacro:id,p_filas:pend.rows});pend=null;
    ok="Cargados "+r.cargados+" estudiantes; globales calculados: "+r.globales+"."+(r.omitidos.length?" No registrados y omitidos: "+r.omitidos.join(", ")+".":"")}}
  else if(a=="tpl"){const b=new Blob(["documento,MA,LC,SC,CN,IN\n1000,58,64,55,52,70\n"],{type:"text/csv"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="plantilla_resultados.csv";l.click()}
  else if(a=="rk"){rk=await call("adm_ranking",{p_grado:parseInt($("#rg").value,10),p_min_simulacros:parseInt($("#rm").value,10)||2})}
  else if(a=="exp"){const g=$("#eg").value,y=$("#ey").value,rows=await call("adm_exportar_resultados",{p_grado:g?+g:null,p_anio:y?+y:null});
   if(!rows.length)msg="No hay resultados con esos filtros.";
   else{const cols=["documento","nombres","apellidos","grado","curso","tipo","simulacro","tipo_simulacro","fecha","anio","MA","LC","SC","CN","IN","GLOBAL"];
    const csv="\uFEFF"+[cols.join(",")].concat(rows.map(r=>cols.map(c=>cel(r[c])).join(","))).join("\r\n")+"\r\n";
    const b=new Blob([csv],{type:"text/csv;charset=utf-8"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="resultados_sisrei_grado-"+(g||"todos")+"_anio-"+(y||"todos")+".csv";l.click();ok="Se exportaron "+rows.length+" filas."}}
  else if(a=="delsim"){const x=SM.find(q=>q.id==v);
   if(x&&confirm("¿Eliminar “"+x.nombre+"”?"+(x.con_resultados?" Se borrarán también los resultados de "+x.con_resultados+" estudiantes.":"")+" No se puede deshacer.")){
    await call("adm_eliminar_simulacro",{p_simulacro:parseInt(v,10)});if(String(selSim)==String(v))selSim=null;ok="Simulacro eliminado."}}
  else if(a=="deluser"){const u=U.find(q=>q.id==v);
   if(u&&confirm("¿Eliminar a "+u.nombre+"? Su código dejará de funcionar y no se puede deshacer.")){await call("adm_eliminar_usuario",{p_usuario:v});ok="Eliminado: "+u.nombre+"."}}
  else if(a=="ver"){V=v}
  else if(a=="back"){V=null;SD=null;closeModal()}
  else if(a=="mclose"){closeModal()}
  else if(a=="psave"){await call("tut_actualizar_perfil",{p_nombre:$("#pn").value.trim(),p_areas:[...document.querySelectorAll(".pa:checked")].map(x=>x.value)});ok="Perfil actualizado."}
  else if(a=="uedit"){const u=U.find(q=>q.id==v);if(u){MD={t:"u",open:true};drawUser(u)}skip=true}
  else if(a=="usave"){await call("adm_actualizar_usuario",{p_usuario:v,p_nombre:$("#un").value.trim(),p_areas:[...document.querySelectorAll(".ua:checked")].map(x=>x.value)});closeModal();ok="Usuario actualizado."}
  else if(a=="nota"){const sim=ds.sim?parseInt(ds.sim,10):null,area=ds.area||null,ev=ds.ev?parseInt(ds.ev,10):null;
   const sname=sim?((SD.resultados.find(r=>r.simulacro_id==sim)||{}).simulacro||"Simulacro"):"",et=ev?((SD.adicionales.find(x=>x.eval_id==ev)||{}).titulo||"Evaluación"):"";
   MD={t:"n",open:true,sim,area,ev,edit:null,label:ev?"Evaluación adicional · "+et:sim?sname+(area?" · "+AN[area]:""):area?"Análisis de "+AN[area]+" (todas las pruebas)":"Análisis general"};skip=true;drawNotes()}
  else if(a=="ned"){MD.edit=v;skip=true;drawNotes()}
  else if(a=="nsave"){const t=$("#nt").value.trim();
   if(!t)msg="Escribe la nota antes de guardar.";
   else{await call("tut_guardar_nota",{p_documento:SD.estudiante.documento,p_texto:t,p_simulacro:MD.sim,p_area:MD.area,p_eval:MD.ev,p_visible:$("#nv").checked,p_nota:MD.edit||null});MD.edit=null;ok="Nota guardada."}}
  else if(a=="ndel"){if(confirm("¿Eliminar esta nota?")){await call("tut_eliminar_nota",{p_nota:v});MD.edit=null;ok="Nota eliminada."}}
  else if(a=="ecr"){const t=$("#et").value.trim();
   if(t.length<2)msg="Escribe un título para la evaluación.";
   else{const id=await call("tut_crear_eval",{p_titulo:t,p_area:$("#ea").value||null,p_grado:$("#eg2").value?parseInt($("#eg2").value,10):null,p_escala:parseInt($("#es").value,10)});await openEval(id);skip=true}}
  else if(a=="cierre"){const y=INFO.anio,t=prompt("Vas a CERRAR el año lectivo "+y+".\n\n• Se descarga una copia CSV de los resultados.\n• Se guardan los promedios de cada estudiante.\n• 11.º egresa y se anonimiza (solo quedan promedios).\n• El resto pasa a inactivo y debe renovar su autorización.\n• Se desactivan todos los tutores.\n\nEscribe exactamente  CERRAR "+y+"  para continuar:");
   if(t!=null){if(t.trim()!=="CERRAR "+y)msg="La confirmación no coincide. No se cerró el año.";
    else{const rows=await call("adm_exportar_resultados",{p_grado:null,p_anio:null});
     if(rows.length)dlCsv("copia_antes_de_cerrar_"+y+".csv",["documento","nombres","apellidos","grado","curso","tipo","simulacro","tipo_simulacro","fecha","anio","MA","LC","SC","CN","IN","GLOBAL"],rows);
     const r=await call("adm_cerrar_anio",{p_confirmacion:t.trim()});VENC=null;HIST=null;
     ok="Año "+r.anio+" cerrado. Fotos anuales: "+r.fotos+" · egresados anonimizados: "+r.egresados+" · estudiantes inactivos: "+r.inactivos+" · tutores desactivados: "+r.tutores+". Ya está abierto el año "+r.siguiente+": genera los códigos de los tutores y carga a los estudiantes que renueven."}}}
  else if(a=="vlist"){VENC=await call("adm_vencidos")}
  else if(a=="vanon"){const n=VENC?VENC.filter(x=>x.vencido).length:0,t=prompt("Se anonimizarán "+n+" estudiantes inactivos hace más de 12 meses. Solo quedarán sus promedios, sin identificación. No se puede deshacer.\n\nEscribe ANONIMIZAR para continuar:");
   if(t!=null){const c=await call("adm_anonimizar_vencidos",{p_confirmacion:t.trim()});VENC=await call("adm_vencidos");ok="Estudiantes anonimizados: "+c+"."}}
  else if(a=="hist"){const y=$("#hy").value,g=$("#hg").value,rows=await call("adm_historial",{p_anio:y?+y:null,p_grado:g?+g:null});
   let agg=await call("adm_historico_agregado");agg=agg.filter(x=>(!y||x.anio==y)&&(!g||x.grado==g));HIST={rows,agg}}
  else if(a=="hexp"){if(HIST)dlCsv("archivo_historico.csv",["anio","documento","nombre","grado","curso","tipo","institucion","promedio","n_simulacros","promedio_adicional","anonimizado"],HIST.rows);skip=true}
  else if(a=="prem"){const doc=$("#pe").value;
   if(!doc)msg="No hay estudiantes activos e internos en ese grado.";
   else{await call("adm_premiar",{p_grado:parseInt($("#pg").value,10),p_puesto:parseInt($("#pp").value,10),p_documento:doc});ok="Premiado registrado."}}
  else if(a=="pdel"){if(confirm("¿Quitar este premio del registro?")){await call("adm_quitar_premio",{p_id:v});ok="Premio quitado."}}
  else if(a=="sedit"){const s=EST.find(q=>q.documento==v);if(s){MD={t:"s",open:true};drawStu(s)}skip=true}
  else if(a=="ssave"){const g=parseInt($("#eg3").value,10);await call("adm_actualizar_estudiante",{p_documento:v,p_nombres:$("#en").value.trim(),p_apellidos:$("#ep").value.trim(),p_grado:g,p_curso:$("#ec").value.trim()||null,p_tipo:$("#et2").value,p_institucion:$("#ei").value.trim()||null});closeModal();ok="Estudiante actualizado."}
  else if(a=="xedit"){const x=SM.find(q=>q.id==v);if(x){MD={t:"x",open:true};drawSim(x)}skip=true}
  else if(a=="xsave"){const t=$("#xt").value;await call("adm_actualizar_simulacro",{p_id:parseInt(v,10),p_nombre:$("#xn").value.trim(),p_tipo:t,p_fecha:$("#xf").value||null,p_obligatorio:t!="virtual",p_cuenta_premio:$("#xp").checked});closeModal();ok="Simulacro actualizado."}
  else if(a=="vedit"){const e=EV.find(q=>q.id==v);if(e){MD={t:"v",open:true};drawEvE(e)}skip=true}
  else if(a=="vsave"){await call("tut_actualizar_eval",{p_eval:parseInt(v,10),p_titulo:$("#vt").value.trim(),p_area:$("#va").value||null,p_grado:$("#vg").value?parseInt($("#vg").value,10):null,p_escala:parseInt($("#vs").value,10)});closeModal();ok="Evaluación actualizada."}
  else if(a=="sload"){
   if(!pendS||pendS.err||pendS.bad.length)msg="Sube un archivo válido.";
   else{const r=await call("adm_importar_estudiantes",{p_filas:pendS.rows});pendS=null;
    ok="Estudiantes creados: "+r.creados+" · actualizados: "+r.actualizados+" · activados con autorización: "+r.activados+(r.renovados?" · renovados: "+r.renovados:"")+".";
    if(r.errores.length)msg=r.errores.length+" filas con error: "+r.errores.slice(0,6).map(x=>"fila "+x.fila+" ("+x.documento+"): "+x.motivo).join("; ")+(r.errores.length>6?"…":"")}}
  else if(a=="stpl"){const csv="\uFEFFdocumento,nombres,apellidos,grado,curso,acudiente_nombre,acudiente_parentesco,acudiente_documento,acudiente_telefono,acudiente_correo,fecha_firma,mencion_publica,tipo,institucion\r\n1000,Ana,Pérez,10,10-01,María Gómez,Madre,52000111,3000000000,maria@correo.co,2027-02-10,si,interno,\r\n",l=document.createElement("a");
   l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));l.download="plantilla_estudiantes.csv";l.click();skip=true}
  else if(a=="cload"){
   if(!pendN||pendN.err||pendN.bad.length)msg="Sube un archivo válido.";
   else{const r=await call("tut_importar_notas_eval",{p_eval:MD.id,p_filas:pendN.rows});pendN=null;
    ok="Se guardaron "+r.guardadas+" notas."+(r.omitidos.length?" Omitidos ("+r.omitidos.length+"): "+r.omitidos.slice(0,8).map(o=>o.documento+(o.motivo=="otro_grado"?" (otro grado)":" (no registrado o inactivo)")).join(", ")+(r.omitidos.length>8?"…":"")+".":"");
    MD.d=await call("tut_ver_eval",{p_eval:MD.id});skip=true;drawEval()}}
  else if(a=="ctpl"){const d=MD.d,csv="\uFEFF"+["documento,nombre,nota"].concat(d.estudiantes.map(s=>cel(s.documento)+","+cel(s.nombre)+","+(s.nota==null?"":s.nota))).join("\r\n")+"\r\n";
   const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));l.download="notas_"+String(d.eval.titulo).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w-]+/g,"_")+".csv";l.click();skip=true}
  else if(a=="ores"){const id=parseInt(v,10),d=await call("tut_ver_eval",{p_eval:id});MD={t:"r",open:true,id,d};drawRes();skip=true}
  else if(a=="radd"){const t=$("#rt").value.trim(),u=$("#ru").value.trim();
   if(!okUrl(u))msg="Escribe un enlace válido que empiece por http:// o https://";
   else{await call("tut_agregar_enlace",{p_eval:MD.id,p_titulo:t||null,p_url:u,p_clase:$("#rc").value,p_visible:$("#rv").checked});ok="Enlace agregado.";MD.d=await call("tut_ver_eval",{p_eval:MD.id});skip=true;drawRes()}}
  else if(a=="rup"){const f=$("#rf").files[0];
   if(!f)msg="Elige un archivo.";else if(f.size>3*1024*1024)msg="El archivo supera 3 MB.";
   else{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>rej(new Error("lectura"));r.readAsDataURL(f)});
    await call("tut_subir_archivo",{p_eval:MD.id,p_nombre:f.name,p_base64:b64,p_visible:$("#rv").checked});ok="Archivo subido.";MD.d=await call("tut_ver_eval",{p_eval:MD.id});skip=true;drawRes()}}
  else if(a=="rdel"){if(confirm("¿Eliminar este archivo o enlace?")){await call("tut_eliminar_recurso",{p_recurso:v});ok="Eliminado.";MD.d=await call("tut_ver_eval",{p_eval:MD.id});skip=true;drawRes()}}
  else if(a=="dl"){const r=await call("rec_descargar",{p_recurso:v}),bin=atob(r.base64),by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
   const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([by],{type:r.mime}));l.download=r.nombre;l.click();skip=true}
  else if(a=="oeval"){await openEval(parseInt(v,10));skip=true}
  else if(a=="esave"){const rows=[...document.querySelectorAll("#md input[data-doc]")].map(i=>({documento:i.dataset.doc,nota:i.value===""?null:Number(String(i.value).replace(",","."))}));
   if(rows.some(r=>r.nota!=null&&(isNaN(r.nota)||r.nota<0||r.nota>MD.d.eval.escala)))msg="Las notas deben estar entre 0 y "+MD.d.eval.escala+".";
   else{const n=await call("tut_guardar_notas_eval",{p_eval:MD.id,p_filas:rows});closeModal();ok="Notas guardadas ("+n+")."}}
  else if(a=="epub"){const e=EV.find(q=>q.id==v);await call("tut_publicar_eval",{p_eval:parseInt(v,10),p_publicada:!e.publicada});ok=e.publicada?"Evaluación oculta para los estudiantes.":"Evaluación publicada: los estudiantes ya la ven."}
  else if(a=="edel"){if(confirm("¿Eliminar la evaluación y todas sus notas y comentarios? No se puede deshacer.")){await call("tut_eliminar_eval",{p_eval:parseInt(v,10)});ok="Evaluación eliminada."}}
  else if(a=="tg"){const u=U.find(q=>q.id==v);await call("adm_usuario_activar",{p_usuario:v,p_activo:!u.activo})}
  else if(a=="fin"){if(confirm("¿Deshabilitar todos los códigos de tutor?")){const n=await call("adm_finalizar_ciclo");ok="Se deshabilitaron "+n+" códigos de tutor."}}
  else if(a=="cyc"){const n=parseInt($("#nc").value,10),y=parseInt($("#ny").value,10);
   if(!(n>=1&&n<=50)||!(y>2000))msg="Cantidad entre 1 y 50 y un año válido.";else{codes=await call("adm_generar_codigos",{p_cantidad:n,p_ciclo:y})}}
  if(a!="cyc")codes=null;if(a!="rk")rk=null;
 }catch(e){if(e.message=="sesion_invalida"){setS(null);msg=ERR.sesion_invalida}else msg=txt(e)}
 busy=false;
 if(!skip){await render();spv();if(MD&&MD.open&&MD.t=="n"&&SD)drawNotes();else if(MD&&MD.open&&MD.t=="e")drawEval();else if(MD&&MD.open&&MD.t=="r"&&MD.d)drawRes()}
}
document.addEventListener("click",e=>{if(e.target.id=="md")return closeModal();const b=e.target.closest("[data-act]");if(b)act(b.dataset.act,b.dataset.v,b.dataset)});
render();
</script></body></html>
