@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--card:#16212e;--tx:#e8eef4;--mu:#9aa8b6;--bd:#2a3a4b;--bl:#7aa5ff;--ok:#4ade80;--bad:#f87171;--tint:#14303a;--hb:#14222e;--hc:#2a4452;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1620;--card:#16212e;--tx:#e8eef4;--mu:#9aa8b6;--bd:#2a3a4b;--bl:#7aa5ff;--ok:#4ade80;--bad:#f87171;--tint:#14303a;--hb:#14222e;--hc:#2a4452;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:780px;margin:0 auto;padding:14px}
.top{background:var(--gr);padding-top:env(safe-area-inset-top,0px)}
.tp{max-width:780px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:14px}
.lg{background:#fff;padding:8px;flex:none}.lg img{display:block;width:66px;height:66px}
.kk{color:#fff;font-weight:800;letter-spacing:.2em;font-size:11px;text-transform:uppercase;line-height:1.6;flex:1}
.hero{background-color:var(--hb);background-image:radial-gradient(circle,transparent 4px,var(--hc) 5px,var(--hc) 6px,transparent 7px);background-size:24px 24px;padding:26px 0 28px;border-bottom:6px solid var(--li)}
.hero h1{margin:0;color:#fff;font-weight:900;font-size:clamp(34px,11vw,60px);line-height:1;-webkit-text-stroke:3px #000;paint-order:stroke fill;word-break:break-word}
.hero p{display:inline-block;margin:10px 0 0;background:var(--card);padding:4px 10px;border-radius:6px;font-weight:700;letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin:0 0 10px;color:var(--bl)}
label{display:block;font-weight:700;font-size:12px;margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
input[type=checkbox]{width:auto}
.btn{background:var(--bl);color:#fff;border:0;border-radius:999px;padding:11px 20px;font:inherit;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-top:10px;cursor:pointer}
.btn.s{background:var(--tint);color:var(--bl);padding:6px 12px;margin:2px 0;font-size:11px}.btn.d{background:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;font:inherit;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.tabs .on{background:var(--bl);color:#fff;border-color:var(--bl)}
.msg{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0;font-weight:600}.ok{color:var(--ok)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;background:var(--tint)}
.sp2{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-bottom:12px}@media(max-width:560px){.sp2{grid-template-columns:1fr}}
.gp{background:var(--gr);color:#fff;border-radius:14px;padding:16px}.gp h2{color:#fff}
.gp .ar{letter-spacing:.08em;text-transform:uppercase;font-size:12px}.gp .bar{background:rgba(255,255,255,.3)}.gp .bar i{background:#fff}
.sb{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:0}
.g{font-size:64px;font-weight:900;color:var(--bl);line-height:1}
.bar{height:9px;border-radius:9px;background:var(--tint);overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.ar{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.pv-t{margin-top:8px}
.codes{background:var(--tint);border-radius:10px;padding:10px;margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
small,.n{color:var(--mu);font-size:12px}

 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&j.message)||("HTTP "+r.status));
 return j;
}
const call=(fn,a)=>rpc(fn,Object.assign({p_token:sess&&sess.token},a));
const txt=e=>ERR[e.message]||("No se pudo completar la acción ("+e.message+").");
async function render(){
 $("#out").innerHTML=sess?'<button class="btn s" data-act="exit">Salir</button>':"";
 if(/PEGA_AQUI/.test(SUPA_URL+SUPA_KEY))return setup();
 if(!sess)return login();
 try{
  if(sess.rol=="estudiante")await stu();else if(sess.rol=="administrador")await adm();else await tut();
 }catch(e){
  if(e.message=="sesion_invalida"){setS(null);msg=ERR.sesion_invalida;return render()}

 }
}

 app.innerHTML=`<div class="card"><div class="tabs"><button class="${e?"on":""}" data-act="tab" data-v="est">Estudiante</button><button class="${e?"":"on"}" data-act="tab" data-v="staff">Tutor o administrador</button></div>

 const d=await call("est_mis_resultados"),st=d.estudiante,G=[];
 d.resultados.forEach(r=>{let g=G.find(x=>x.s==r.simulacro);if(!g)G.push(g={s:r.simulacro,v:{}});g.v[r.area]=r.puntaje});

 hero("¡Hola, "+String(st.nombre).split(" ")[0]+"!","Documento "+st.documento+" · Grado "+st.grado+(st.curso?" · "+st.curso:""));
 app.innerHTML=(l?`<div class="sp2"><div class="gp"><h2>Tus áreas · ${esc(l.s)}</h2>${AR.map(([k,n])=>`<div class="ar"><span>${n}</span><div class="bar"><i style="width:${Math.min(100,l.v[k]||0)}%"></i></div><b>${pf(l.v[k])}</b></div>`).join("")}</div>

 :'<div class="card">Aún no tienes resultados.</div>')+
 (d.evaluaciones.length?`<div class="card"><h2>Evaluación individual</h2>${d.evaluaciones.map(v=>`<p><b>${esc(v.area||"General")}</b> · <small>${esc(v.fecha)}</small><br>Fortalezas: ${esc(v.fortalezas)}<br>Por mejorar: ${esc(v.debilidades)}<br>Recomendación: ${esc(v.recomendacion)}</p>`).join("")}</div>`:"")+
 '<p class="n">Los puntajes son estimados, no oficiales.</p>';
}

async function adm(){
 const [E,us,sm]=await Promise.all([call("adm_listar_estudiantes"),call("adm_listar_usuarios"),call("adm_listar_simulacros")]);U=us;SM=sm;hero("Panel","Administrador");
 const pc=e=>e=="activo"?"ok":"bad",lbl={activo:"Activo",pendiente:"Pendiente",excluido:"Excluido"};
 const mx=Math.max(2026,...U.map(u=>u.ciclo||0)),YR=[...new Set(SM.filter(x=>x.fecha).map(x=>String(x.fecha).slice(0,4)))].sort().reverse();
 app.innerHTML=`<div class="card"><h2>Panel del administrador</h2><small>${E.length} estudiantes · ${E.filter(s=>s.estado=="activo").length} activos · ${U.filter(u=>u.rol=="tutor"&&u.activo).length} códigos de tutor activos</small></div>
 <div class="card"><h2>Estudiantes</h2><div class="sc"><table><tr><th>Documento</th><th>Nombre</th><th>Grado</th><th>Estado</th><th></th></tr>${E.map(s=>`<tr><td>${esc(s.documento)}</td><td>${esc(s.nombre)}</td><td>${esc(s.grado)}</td><td><span class="pill" style="color:var(--${pc(s.estado)})">${lbl[s.estado]||esc(s.estado)}</span></td><td>${s.estado=="activo"?`<button class="btn s" data-act="rev" data-v="${esc(s.documento)}">Revocar</button>`:`<button class="btn s" data-act="recv" data-v="${esc(s.documento)}">Autorización recibida</button>`} <button class="btn s" data-act="del" data-v="${esc(s.documento)}">Borrar</button></td></tr>`).join("")}</table></div>
 <label>Agregar estudiante</label><div class="row"><input id="nd" inputmode="numeric" placeholder="Documento"><input id="nn" placeholder="Nombres"><input id="na" placeholder="Apellidos"><input id="ng" inputmode="numeric" placeholder="Grado"><input id="nk" placeholder="Curso"></div>
 <button class="btn" data-act="add">Agregar (queda pendiente)</button></div>
 <div class="card"><h2>Simulacros y resultados</h2>
 <label>Crear simulacro</label><div class="row"><input id="sn" placeholder="Nombre (ej. Simulacro 1)"><select id="st"><option value="diagnostico">Diagnóstico</option><option value="fisico">Físico</option><option value="virtual">Virtual</option><option value="final">Final</option></select><input id="sf" type="date"></div>
 <label style="font-weight:400"><input id="sp" type="checkbox" checked> Cuenta para la premiación</label>
 <button class="btn" data-act="sim">Crear simulacro</button>
 ${SM.length?`<div class="sc pv-t"><table><tr><th>Simulacro</th><th>Tipo</th><th>Fecha</th><th>Estudiantes</th><th></th></tr>${SM.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${esc(x.tipo)}</td><td>${esc(x.fecha||"–")}</td><td>${esc(x.con_resultados)}</td><td><button class="btn s" data-act="delsim" data-v="${esc(x.id)}">Eliminar</button></td></tr>`).join("")}</table></div>`:""}
 <label>Cargar resultados desde un CSV</label>
 <select id="ss">${SM.length?SM.map(x=>`<option value="${x.id}" ${x.id==selSim?"selected":""}>${esc(x.nombre)}${x.fecha?" · "+esc(x.fecha):""} (${x.con_resultados} con resultados)</option>`).join(""):"<option value=''>Crea primero un simulacro</option>"}</select>
 <input id="fl" class="pv-t" type="file" accept=".csv,text/csv">
 <small>Columnas: documento, MA, LC, SC, CN, IN (puntajes de 0 a 100). En Google Sheets: Archivo, Descargar, Valores separados por comas (.csv). Si repites la carga de un simulacro, se actualizan los puntajes.</small>
 <div id="pv"></div><button class="btn s" data-act="tpl">Descargar plantilla</button></div>
 <div class="card"><h2>Exportar resultados</h2>
 <div class="row"><select id="eg" aria-label="Grado"><option value="">Todos los grados</option>${[8,9,10,11].map(g=>`<option value="${g}">${g}.º</option>`).join("")}</select><select id="ey" aria-label="Año"><option value="">Todos los años</option>${YR.map(y=>`<option>${y}</option>`).join("")}</select></div>
 <button class="btn" data-act="exp">Descargar CSV</button>
 <p><small>El archivo contiene datos personales de menores: guárdalo en un lugar seguro y no lo compartas por canales abiertos. El grado es el registrado actualmente.</small></p></div>
 <div class="card"><h2>Ranking de 9.º y 10.º</h2>
 <div class="row"><select id="rg" aria-label="Grado"><option value="9">9.º</option><option value="10">10.º</option></select><input id="rm" type="number" min="1" value="2" aria-label="Mínimo de simulacros"></div>
 <button class="btn" data-act="rk">Ver ranking</button>
 ${rk?`<div class="sc pv-t"><table><tr><th>#</th><th>Documento</th><th>Nombre</th><th>Promedio</th><th>Simulacros</th></tr>${rk.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.documento)}</td><td>${esc(r.nombre)}</td><td><b>${esc(r.promedio)}</b></td><td>${esc(r.simulacros)}</td></tr>`).join("")||"<tr><td colspan=5>Sin datos suficientes</td></tr>"}</table></div>`:""}
 <p><small>Cuenta solo los simulacros marcados para premiación y exige el mínimo indicado. En 11.º, los mejores ICFES los proporciona el colegio.</small></p></div>
 <div class="card"><h2>Personal</h2><div class="sc"><table><tr><th>Nombre</th><th>Rol</th><th>Ciclo</th><th>Estado</th><th></th></tr>${U.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.rol)}</td><td>${esc(u.ciclo||"–")}</td><td><span class="pill" style="color:var(--${u.activo?"ok":"bad"})">${u.activo?"Activo":"Deshabilitado"}</span></td><td>${u.rol=="administrador"?"":`<button class="btn s" data-act="tg" data-v="${esc(u.id)}">${u.activo?"Deshabilitar":"Habilitar"}</button> <button class="btn s" data-act="deluser" data-v="${esc(u.id)}">Eliminar</button>`}</td></tr>`).join("")}</table></div>
 <button class="btn d" data-act="fin">Finalizar actividades (deshabilitar tutores)</button>
 <label>Nuevo ciclo</label><div class="row"><input id="nc" type="number" min="1" max="50" value="3" aria-label="Cantidad"><input id="ny" type="number" value="${mx+1}" aria-label="Año del ciclo"></div>
 <button class="btn" data-act="cyc">Generar códigos nuevos (cantidad y año)</button>
 ${codes?`<div class="codes"><b>Códigos (se muestran una sola vez; entrégalos de forma personal):</b><br>${codes.map(c=>esc(c.nombre)+": <b>"+esc(c.codigo)+"</b>").join("<br>")}</div>`:""}</div>
 <p class="msg">${esc(msg)}</p><p class="msg ok">${esc(ok)}</p>`;
 pv();
}
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"");
const AL={documento:"documento",doc:"documento",identificacion:"documento",ma:"MA",matematicas:"MA",lc:"LC",lectura:"LC",lecturacritica:"LC",sc:"SC",sociales:"SC",socialesyciudadanas:"SC",cn:"CN",naturales:"CN",cienciasnaturales:"CN",in:"IN",ingles:"IN"};
function parseCSV(t){t=t.replace(/^\uFEFF/,"");const f=t.split(/\r?\n/)[0]||"",d=f.split(";").length>f.split(",").length?";":",",R=[];let r=[],c="",q=false;
 for(let i=0;i<t.length;i++){const h=t[i];
  if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}
  else if(h=='"')q=true;else if(h==d){r.push(c);c=""}
  else if(h=="\n"||h=="\r"){if(h=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()!==""))R.push(r);r=[]}
  else c+=h}
 r.push(c);if(r.some(x=>x.trim()!==""))R.push(r);return R}
function leer(txt){
 const R=parseCSV(txt),H=(R[0]||[]).map(x=>AL[norm(x)]||null),bad=[],rows=[];
 if(!H.includes("documento"))return{err:"No encuentro la columna documento en la primera fila."};
 if(!AR.some(a=>H.includes(a[0])))return{err:"No encuentro columnas de áreas (MA, LC, SC, CN, IN)."};
 R.slice(1).forEach((c,i)=>{const o={documento:""};
  H.forEach((k,j)=>{if(!k)return;const v=(c[j]||"").trim();
   if(k=="documento"){o.documento=v.replace(/\D/g,"");return}
   if(v==="")return;const n=Number(v.replace("%","").replace(",","."));
   if(isNaN(n)||n<0||n>100)bad.push("fila "+(i+2)+": valor “"+v+"” en "+k);else o[k]=n});
  if(o.documento)rows.push(o)});
 return rows.length?{rows,bad}:{err:"El archivo no tiene filas con documento."};
}
function pv(){const el=$("#pv");if(!el)return;if(!pend){el.innerHTML="";return}
 if(pend.err){el.innerHTML='<p class="msg">'+esc(pend.err)+"</p>";return}
 el.innerHTML=`<p><b>${pend.rows.length}</b> estudiantes en el archivo.</p>`+(pend.bad.length?`<p class="msg">${pend.bad.length} valores inválidos. Corrige el archivo y súbelo de nuevo.<br>${esc(pend.bad.slice(0,5).join("; "))}</p>`:"")+
 `<div class="sc"><table><tr><th>Documento</th>${AR.map(a=>"<th>"+a[0]+"</th>").join("")}</tr>${pend.rows.slice(0,5).map(r=>`<tr><td>${esc(r.documento)}</td>${AR.map(a=>"<td>"+(r[a[0]]==null?"–":r[a[0]])+"</td>").join("")}</tr>`).join("")}</table></div>`+
 (pend.bad.length?"":'<button class="btn" data-act="load">Cargar resultados</button>');
}
document.addEventListener("change",e=>{
 if(e.target.id=="ss")selSim=e.target.value;
 if(e.target.id=="fl"){const f=e.target.files[0];if(!f){pend=null;return pv()}const rd=new FileReader();rd.onload=()=>{pend=leer(String(rd.result));pv()};rd.readAsText(f)}
});
const hero=(t,s)=>{$("#hero").innerHTML='<div class="w"><h1>'+esc(t)+'</h1>'+(s?"<p>"+esc(s)+"</p>":"")+"</div>"};
const cel=v=>{if(v==null)return"";let s=String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return/[",\n\r;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
async function act(a,v){
 if(busy)return;busy=true;msg="";ok="";
 try{
  if(a=="tab")tab=v;
  else if(a=="exit"){try{await call("cerrar_sesion")}catch(e){}setS(null);codes=null}
  else if(a=="login"){
   const x=$("#in").value.trim();if(!x){msg="Escribe tu "+(tab=="est"?"número de documento.":"código.")}
   else if(tab=="est"){const r=await rpc("ingresar_estudiante",{p_documento:x});if(r.ok)setS({rol:"estudiante",token:r.token});else msg=MOT[r.motivo]||"No se pudo ingresar."}
   else{const r=await rpc("ingresar_personal",{p_codigo:x});if(r.ok)setS({rol:r.rol,token:r.token,nombre:r.nombre});else msg=MOT[r.motivo]||"No se pudo ingresar."}
  }
  else if(a=="add"){const d=$("#nd").value.trim(),n=$("#nn").value.trim(),g=parseInt($("#ng").value,10);
   if(!/^\d{4,12}$/.test(d)||!n||!(g>=8&&g<=11))msg="Escribe documento (4 a 12 números), nombres y un grado entre 8 y 11.";
   else{await call("adm_agregar_estudiante",{p_documento:d,p_nombres:n,p_apellidos:$("#na").value.trim(),p_grado:g,p_curso:$("#nk").value.trim()||null});ok="Estudiante agregado como pendiente."}}
  else if(a=="recv"){const n=(prompt("Nombre del acudiente que firmó la autorización:")||"").trim();if(n){await call("adm_registrar_autorizacion",{p_documento:v,p_acudiente_nombre:n});ok="Autorización registrada. El estudiante ya puede ingresar."}}
  else if(a=="rev"){if(confirm("¿Revocar la autorización? El estudiante perderá el acceso.")){await call("adm_revocar_autorizacion",{p_documento:v,p_borrar:false});ok="Autorización revocada."}}
  else if(a=="del"){if(confirm("¿Borrar al estudiante y sus datos personales? Esto no se puede deshacer.")){await call("adm_revocar_autorizacion",{p_documento:v,p_borrar:true});ok="Estudiante borrado."}}
  else if(a=="sim"){const n=$("#sn").value.trim(),t=$("#st").value;
   if(!n)msg="Escribe un nombre para el simulacro.";
   else{selSim=await call("adm_crear_simulacro",{p_nombre:n,p_tipo:t,p_fecha:$("#sf").value||null,p_obligatorio:t!="virtual",p_cuenta_premio:$("#sp").checked});ok="Simulacro creado."}}
  else if(a=="load"){const id=parseInt($("#ss").value,10);
   if(!id)msg="Elige un simulacro.";else if(!pend||!pend.rows||pend.bad.length)msg="Sube un archivo válido.";
   else{const r=await call("adm_cargar_resultados",{p_simulacro:id,p_filas:pend.rows});pend=null;
    ok="Cargados "+r.cargados+" estudiantes; globales calculados: "+r.globales+"."+(r.omitidos.length?" No registrados y omitidos: "+r.omitidos.join(", ")+".":"")}}
  else if(a=="tpl"){const b=new Blob(["documento,MA,LC,SC,CN,IN\n1000,58,64,55,52,70\n"],{type:"text/csv"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="plantilla_resultados.csv";l.click()}
  else if(a=="rk"){rk=await call("adm_ranking",{p_grado:parseInt($("#rg").value,10),p_min_simulacros:parseInt($("#rm").value,10)||2})}
  else if(a=="exp"){const g=$("#eg").value,y=$("#ey").value,rows=await call("adm_exportar_resultados",{p_grado:g?+g:null,p_anio:y?+y:null});
   if(!rows.length)msg="No hay resultados con esos filtros.";
   else{const cols=["documento","nombres","apellidos","grado","curso","tipo","simulacro","tipo_simulacro","fecha","anio","MA","LC","SC","CN","IN","GLOBAL"];
    const csv="\uFEFF"+[cols.join(",")].concat(rows.map(r=>cols.map(c=>cel(r[c])).join(","))).join("\r\n")+"\r\n";
    const b=new Blob([csv],{type:"text/csv;charset=utf-8"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="resultados_sisrei_grado-"+(g||"todos")+"_anio-"+(y||"todos")+".csv";l.click();ok="Se exportaron "+rows.length+" filas."}}
  else if(a=="delsim"){const x=SM.find(q=>q.id==v);
   if(x&&confirm("¿Eliminar “"+x.nombre+"”?"+(x.con_resultados?" Se borrarán también los resultados de "+x.con_resultados+" estudiantes.":"")+" No se puede deshacer.")){
    await call("adm_eliminar_simulacro",{p_simulacro:parseInt(v,10)});if(String(selSim)==String(v))selSim=null;ok="Simulacro eliminado."}}
  else if(a=="deluser"){const u=U.find(q=>q.id==v);
   if(u&&confirm("¿Eliminar a "+u.nombre+"? Su código dejará de funcionar y no se puede deshacer.")){await call("adm_eliminar_usuario",{p_usuario:v});ok="Eliminado: "+u.nombre+"."}}
  else if(a=="tg"){const u=U.find(q=>q.id==v);await call("adm_usuario_activar",{p_usuario:v,p_activo:!u.activo})}
  else if(a=="fin"){if(confirm("¿Deshabilitar todos los códigos de tutor?")){const n=await call("adm_finalizar_ciclo");ok="Se deshabilitaron "+n+" códigos de tutor."}}
  else if(a=="cyc"){const n=parseInt($("#nc").value,10),y=parseInt($("#ny").value,10);
   if(!(n>=1&&n<=50)||!(y>2000))msg="Cantidad entre 1 y 50 y un año válido.";else{codes=await call("adm_generar_codigos",{p_cantidad:n,p_ciclo:y})}}
  if(a!="cyc")codes=null;if(a!="rk")rk=null;
 }catch(e){if(e.message=="sesion_invalida"){setS(null);msg=ERR.sesion_invalida}else msg=txt(e)}
 busy=false;render();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)act(b.dataset.act,b.dataset.v)});
render();
</script></body></html>
